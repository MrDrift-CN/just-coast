name: 缺陷报告
description: 报告可以稳定复现的错误或非预期行为
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除敏感信息，并尽量提供最小可复现步骤。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际行为以及你认为正确的行为。
      placeholder: 清楚、简洁地描述问题。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 包括操作系统、浏览器、Node.js 版本和相关配置。
      placeholder: Windows 11、Chrome、Node.js 24
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴脱敏后的日志，或拖入截图。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我已删除令牌、密码、Cookie、私钥和其他敏感信息。
          required: true
