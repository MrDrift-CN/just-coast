name: PR Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate PR title
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR 标题不符合 Conventional Commits：$PR_TITLE"
            echo "期望格式：<type>(<scope>)!: <description>"
            exit 1
          fi

      - name: Validate commit subjects
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'
          invalid=0

          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit 不符合 Conventional Commits：$subject"
              invalid=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")

          exit "$invalid"
